<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10252b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Clawbound · The Sunken Vault</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081e25;color:#f5e7c5;font:16px system-ui}main{height:100%;display:grid;place-content:center;text-align:center}iframe{display:block;width:100%;height:100%;border:0}button{padding:16px;background:#e5bd75;border:0;border-radius:10px;font:inherit}</style></head><body><main id="loading"><h1>CLAWBOUND</h1><p>Opening the vault…</p></main><script>
(async()=>{
 const release='20260926-3',scope=new URL('./',location.href).href;
 // This uncached entry point retires old workers before creating a new game client.
 // Browser storage and saved expeditions are never cleared.
 try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===scope&&new URL(r.active?.scriptURL||location.href).searchParams.get('v')!==release).map(r=>r.unregister()));}}catch{}
 const frame=document.createElement('iframe');frame.title='Clawbound game';frame.allow='autoplay; fullscreen';frame.src='./?v='+release;document.body.replaceChildren(frame);
})();
</script></body></html>
