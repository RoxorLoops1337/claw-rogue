gap:4px}.route-dot{width:5px;height:5px;background:#3a4651;border-radius:50%}.route-dot.done{background:var(--mint)}.route-dot.current{background:#fff;box-shadow:0 0 8px #baf27c}
.battle{position:relative;flex:0 0 27%;min-height:156px;max-height:240px;border:1px solid #a2c6b923;background:linear-gradient(180deg,#26392e,#19282a);border-radius:18px;overflow:hidden}.battle canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.fighter-labels{display:flex;justify-content:space-between;position:absolute;top:12px;left:13px;right:13px;gap:12px}.fighter{width:37%}.fighter.enemy{text-align:right}.fighter .name{font-size:11px;letter-spacing:.3px;font-weight:800;text-shadow:0 2px 2px #0008;margin-bottom:6px}.health-line{display:flex;gap:5px;align-items:center}.health-line .bar{flex:1;height:5px;background:#091519aa;border-radius:6px;overflow:hidden}.health-line .bar i{display:block;height:100%;background:var(--mint);width:100%;transition:width .35s}.enemy .bar i{background:#f38378}.hp-value{font-size:9px;font-weight:850;white-space:nowrap;color:#d5e4d4}.intent{position:absolute;bottom:10px;right:12px;background:#14232ce6;border:1px solid #ffffff12;border-radius:8px;padding:5px 7px;font-size:10px;color:#f4aaa0;font-weight:700}.shield-badge{position:absolute;bottom:10px;left:12px;background:#10222de6;color:#7fddf8;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:750;border:1px solid #66cde92a}.battle-tag{position:absolute;top:13px;left:50%;transform:translateX(-50%);color:#d5efbb55;font-size:9px;font-weight:900;letter-spacing:1.4px}.status{min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;color:#d1ddd9;font-size:12px;line-height:1.3;font-weight:650;flex:none;padding:0 8px}.status strong{color:var(--mint)}
.machine{flex:1;min-height:235px;display:flex;flex-direction:column;position:relative;border-radius:18px;background:#283345;border:1px solid #516075;box-shadow:0 5px 0 #080e18,inset 0 1px #ffffff15;overflow:hidden}.machine-top{height:31px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#303c50;flex:none;border-bottom:1px solid #ffffff0d}.machine-title{font-weight:900;font-size:9px;letter-spacing:1.7px;color:#b6c7d9;display:flex;gap:7px;align-items:center}.led{width:5px;height:5px;background:var(--mint);box-shadow:0 0 7px #baf27c;border-radius:50%}.machine-stat{font-size:10px;font-weight:750;color:#cbd7e3}.machine-stat b{color:var(--gold)}.glass{position:relative;flex:1;margin:8px;border:2px solid #101724;border-radius:11px;background:#121e2c;overflow:hidden;min-height:0}.glass canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.glass:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 3px 15px #0008;border-radius:9px}.machine-foot{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 13px 7px;color:#8d9bb0;font-size:9px;font-weight:750;letter-spacing:.6px;flex:none}.capacity{display:flex;gap:3px}.capacity i{width:9px;height:4px;border-radius:2px;background:#526079}.capacity i.loaded{background:var(--mint);box-shadow:0 0 4px #baf27c33}.controls{display:grid;grid-template-columns:66px 1fr 66px;gap:9px;flex:none;height:57px;margin-top:3px}.move{background:linear-gradient(#303b4b,#253041);color:#c2d1df;border:1px solid #4b5a6c;border-bottom:4px solid #152030;border-radius:13px;touch-action:none}.move svg{width:21px;height:21px;fill:currentColor}.move:active{transform:translateY(2px);border-bottom-width:2px}.drop{background:linear-gradient(#caf894,#a6df69);color:#253923;font-weight:950;font-size:15px;letter-spacing:1px;border:1px solid #e2ffb9;border-bottom:4px solid #629448;border-radius:13px;box-shadow:0 3px 14px #a0eb6520;display:flex;justify-content:center;align-items:center;gap:10px}.drop:active{transform:translateY(2px);border-bottom-width:2px}.drop svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.drop:disabled{opacity:1;background:linear-gradient(#3a4a41,#2b3b35);color:#9cac9f;border-color:#4c6052;border-bottom-color:#1a2821;box-shadow:none}.hint{font-size:9px;color:#768899;text-align:center;letter-spacing:.3px;flex:none;height:13px}.inventory{display:flex;justify-content:center;gap:7px;min-height:0;font-size:9px;color:#a7b4c3;flex:none}.inventory:empty{display:none}.relic-tag{padding:3px 6px;border:1px solid #ffffff12;border-radius:6px;white-space:nowrap}
dialog{background:#172333;color:var(--ink);width:min(420px,calc(100% - 30px));max-height:90dvh;border:1px solid #50627a;border-radius:22px;padding:23px;box-shadow:0 25px 100px #000b}dialog::backdrop{background:#060e19d9;backdrop-filter:blur(7px)}.modal-eyebrow{color:var(--mint);font-size:10px;font-weight:850;letter-spacing:2px}.modal-title{font-size:28px;letter-spacing:-1px;margin:9px 0}.modal-copy{font-size:13px;color:#aebdcc;line-height:1.6;margin:0 0 17px}.choices{display:grid;gap:8px}.choice{width:100%;background:linear-gradient(115deg,#26374b,#213044);border:1px solid #4c6077;border-radius:13px;min-height:68px;text-align:left;color:var(--ink);padding:12px;display:flex;align-items:center;gap:13px}.choice:hover{border-color:var(--mint);background:#2b403f}.choice-mark{display:grid;place-items:center;font-size:22px;background:#c8ec9f0e;border:1px solid #c8ec9f22;width:41px;height:41px;flex:none;border-radius:12px;color:var(--mint)}.choice b{display:block;font-size:14px}.choice small{display:block;font-size:11px;color:#abbdc9;margin-top:4px;line-height:1.4}.choice .arrow{margin-left:auto;color:#9cadbc}.modal-close{width:100%;border:1px solid #45566b;border-radius:11px;background:#2b3e51;color:var(--ink);padding:12px;margin-top:13px;font-size:13px;font-weight:750}.legend{display:grid;gap:10px;margin:14px 0}.legend-row{display:flex;align-items:center;gap:9px;font-size:12px;color:#bbcbd4}.legend-row .sample{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800}.level-pill{background:#9eda781a;border:1px solid #9eda7833;color:#c7eca4;padding:7px 11px;border-radius:9px;font-size:12px;margin-bottom:14px;display:inline-block}.desktop-note{display:none}.flash{animation:flash .3s ease-out}@keyframes flash{from{filter:brightness(1.55)}to{filter:brightness(1)}}
@media(min-width:600px){body{display:grid;place-items:center;min-height:100vh;padding:20px}.app{height:min(900px,calc(100dvh - 40px));border-radius:28px;border:1px solid #3e4a59;box-shadow:0 35px 100px #0008;min-height:660px}.hint{font-size:10px}}
@media(max-height:700px){.app{gap:6px;min-height:570px;padding-top:6px;padding-bottom:6px}header{height:31px}.brand{font-size:17px}.route{height:18px}.battle{min-height:133px;flex-basis:25%}.status{min-height:27px;font-size:11px}.controls{height:51px}.machine{min-height:222px}.hint{height:11px}.machine-top{height:27px}.inventory{display:none}}
@media(prefers-reduced-motion:reduce){.flash{animation:none}.health-line .bar i{transition:none}}

<body>
<main class="app" aria-label="Clawbound game">
<header><div class="brand"><span>⌁</span>CLAW<b>BOUND</b></div><div class="top-actions"><div class="coin-counter" aria-label="Coins"><i class="coin-icon"></i><span id="coins">0</span></div><button class="icon-button" id="help" aria-label="How to play">?</button><button class="icon-button" id="pause" aria-label="Pause game">Ⅱ</button></div></header>
<div class="route"><span class="floor" id="floor">FLOOR 01</span><div class="route-line"></div><span id="zone">MOSSY OUTPOST</span><div class="route-dots" id="routeDots" aria-hidden="true"></div></div>
<section class="battle" aria-label="Battle arena"><canvas id="battleCanvas" aria-label="Your robot faces the enemy"></canvas><div class="fighter-labels"><div class="fighter"><div class="name">YOU · SCRAPPER</div><div class="health-line"><div class="bar"><i id="heroBar"></i></div><span class="hp-value" id="heroHp">40/40</span></div></div><div class="fighter enemy"><div class="name" id="enemyName">MOSS MUNCHER</div><div class="health-line"><span class="hp-value" id="enemyHp">24/24</span><div class="bar"><i id="enemyBar"></i></div></div></div></div><div class="battle-tag">VS</div><div class="shield-badge" id="shield">◇ 0 BLOCK</div><div class="intent" id="intent">Next attack · 4</div></section>
<div class="status" id="status" role="status" aria-live="polite">Slide to aim. Scoop a handful.</div>
<section class="machine" aria-label="Claw machine"><div class="machine-top"><div class="machine-title"><i class="led"></i>LOOT CHAMBER</div><div class="machine-stat"><b id="drops">6</b> DROPS LEFT</div></div><div class="glass"><canvas id="machineCanvas" aria-label="Drag to aim the claw, then press Grab"></canvas></div><div class="machine-foot"><span id="clawLabel">STANDARD CLAW</span><div class="capacity" id="capacity" aria-label="Claw capacity: 5"></div><span id="load">0 / 5</span></div></section>
<div class="controls"><button class="move" id="left" aria-label="Move claw left"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg></button><button class="drop" id="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v6m-3 0h6M9 8 5 15l3 5 3-2m4-10 4 7-3 5-3-2"/></svg><span id="dropLabel">GRAB</span></button><button class="move" id="right" aria-label="Move claw right"><svg viewBox="0 0 24 24"><path d="m8 4 10 8-10 8z"/></svg></button></div>
<div class="inventory" id="inventory"></div><div class="hint">DRAG TO AIM · HOLD ARROWS TO MOVE · SCOOP UP TO 5</div>
</main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modal-eyebrow" id="modalEyebrow"></div><h1 class="modal-title" id="modalTitle"></h1><div class="modal-copy" id="modalCopy"></div><div id="modalExtra"></div><div class="choices" id="choices"></div></dialog>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), machine=$('#machineCanvas'), battle=$('#battleCanvas'),ctx=machine.getContext('2d'),art=battle.getContext('2d');
const MW=420,MH=340,LEFT=12,RIGHT=408,FLOOR=326,STEP=1/120;
let run,claw,balls=[],effects=[],floaters=[],phase='aim',phaseTime=0,clock=0,last=0,accumulator=0,paused=false,modalMode='',leftHeld=false,rightHeld=false,aimTarget=null,shake=0,battlePulse=0,enemyPulse=0,combo=0,comboTime=0,best=0;
try{best=Number(localStorage.getItem('clawbound-best'))||0}catch{}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rand=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const TYPES={sword:{name:'Sword',color:'#ff9b88',rim:'#ffe2c4',dark:'#743948',damage:4},shield:{name:'Shield',color:'#81d7e6',rim:'#ccf8f2',dark:'#225a73',block:4},heart:{name:'Heart',color:'#f292bb',rim:'#ffdbdf',dark:'#7f385d',heal:3},spark:{name:'Spark',color:'#b9a0f1',rim:'#e9deff',dark:'#58427c',damage:6},coin:{name:'Coin',color:'#f3cd76',rim:'#fff0bc',dark:'#89613b',coins:2},stone:{name:'Scrap',color:'#91acb8',rim:'#ccdae0',dark:'#405a70',damage:1}};
const weighted=['sword','sword','sword','sword','shield','shield','heart','spark','coin','stone','stone'];
const UPGRADES=[
{id:'size',mark:'↔',name:'Bigger claws',desc:'Wider scoop + 1 extra item. Reach deeper into the pile.',apply:()=>{run.size++;run.capacity=Math.min(10,run.capacity+1)}},
{id:'capacity',mark:'⊞',name:'Deep pockets',desc:'Carry 2 extra items in each grab.',apply:()=>run.capacity=Math.min(10,run.capacity+2)},
{id:'blade',mark:'✦',name:'Sharp edges',desc:'Every sword deals 2 more damage.',apply:()=>run.blade+=2},
{id:'block',mark:'◇',name:'Force field',desc:'Every shield gives 2 more block.',apply:()=>run.block+=2},
{id:'combo',mark:'×',name:'Big haul bonus',desc:'Collect 4+ items to deal 5 extra damage.',apply:()=>run.haul+=5},
{id:'battery',mark:'ϟ',name:'Spare battery',desc:'One extra drop on every floor.',apply:()=>run.extraDrops++},
{id:'repair',mark:'+',name:'Fresh plating',desc:'+8 maximum health. Restore 12 health now.',apply:()=>{run.maxHp+=8;run.hp=Math.min(run.maxHp,run.hp+12)}},
{id:'spark',mark:'⌁',name:'Overcharged',desc:'Every spark deals 3 more damage.',apply:()=>run.spark+=3}
];
function message(text){$('#status').textContent=text}
function updateUI(){
$('#coins').textContent=run.coins;$('#floor').textContent='FLOOR '+String(run.floor).padStart(2,'0');$('#zone').textContent=run.floor===10?'THE FINAL VAULT':run.floor%5===0?'BOSS CHAMBER':run.floor<5?'MOSSY OUTPOST':'CRYSTAL DEPTHS';
$('#heroHp').textContent=`${run.hp}/${run.maxHp}`;$('#heroBar').style.width=(100*run.hp/run.maxHp)+'%';$('#enemyHp').textContent=`${Math.max(0,run.enemy.hp)}/${run.enemy.maxHp}`;$('#enemyBar').style.width=(100*Math.max(0,run.enemy.hp)/run.enemy.maxHp)+'%';$('#enemyName').textContent=run.enemy.name;
$('#shield').textContent=`◇ ${run.shield} BLOCK`;$('#intent').textContent=`Next attack · ${run.enemy.attack}`;$('#drops').textContent=run.drops;$('#drop').disabled=phase!=='aim'||paused;
$('#dropLabel').textContent=paused?'PAUSED':{aim:'GRAB',down:'LOWERING',close:'SCOOPING',up:'NICE CATCH',carry:'DELIVERING',release:'LOOT!',resolve:'YOUR TURN',enemy:'INCOMING',reward:'FLOOR CLEAR',over:'RUN COMPLETE'}[phase]||'GRAB';
$('#clawLabel').textContent=run.size>=2?'MEGA CLAW':run.size?'WIDE CLAW':'STANDARD CLAW';$('#load').textContent=claw.held.length+' / '+run.capacity;$('#capacity').setAttribute('aria-label',`Claw capacity: ${run.capacity}`);$('#capacity').innerHTML=Array.from({length:run.capacity},(_,i)=>`<i class="${i<claw.held.length?'loaded':''}"></i>`).join('');
$('#routeDots').innerHTML=Array.from({length:10},(_,i)=>`<i class="route-dot ${i+1<run.floor?'done':i+1===run.floor?'current':''}"></i>`).join('');
$('.hint').textContent=`DRAG TO AIM · HOLD ARROWS TO MOVE · SCOOP UP TO ${run.capacity}`;
$('#inventory').replaceChildren();Object.entries(run.relics).slice(-3).forEach(([id,count])=>{const u=UPGRADES.find(u=>u.id===id);let el=document.createElement('span');el.className='relic-tag';el.textContent=`${u.mark} ${u.name}${count>1?' ×'+count:''}`;$('#inventory').append(el)});
}
function newBall(x,y,type){return {x,y,oldX:x,oldY:y,vx:rand(-5,5),vy:0,r:12.8+Math.random()*1.5,type,angle:rand(-.5,.5),spin:rand(-1,1),held:false,alive:true}}
function fillPile(){balls=[];for(let row=0;row<6;row++){for(let col=0;col<13-(row%2);col++){let type=weighted[Math.floor(Math.random()*weighted.length)];balls.push(newBall(32+col*29+(row%2)*14.5+rand(-1,1),FLOOR-15-row*25.3,type))}}// Weapons stay available near the surface.
for(let i=balls.length-12;i<balls.length;i+=3)balls[i].type=i%2?'sword':'spark';}
function setPhase(value){phase=value;phaseTime=0;updateUI()}
function startFloor(){const boss=run.floor%5===0;const maxHp=boss?50+run.floor*7:19+run.floor*7;run.enemy={name:boss?'THE VAULT KEEPER':['MOSS MUNCHER','CAVE CRITTER','GLOOM SPRITE','THORN GUARD'][(run.floor-1)%4],hp:maxHp,maxHp,attack:3+Math.floor(run.floor*.85)+(boss?2:0),boss,kind:boss?4:(run.floor-1)%4};run.drops=6+run.extraDrops;run.shield=Math.min(run.shield,12);claw={x:210,y:48,open:1,held:[],prevX:210,prevY:48,depth:210};effects=[];floaters=[];combo=0;leftHeld=rightHeld=false;aimTarget=null;fillPile();for(let i=0;i<100;i++)physics(STEP);setPhase('aim');message('Slide to aim. Scoop a handful.');}
function newRun(){closeModal();run={floor:1,hp:40,maxHp:40,shield:0,coins:0,size:0,capacity:5,blade:0,block:0,spark:0,haul:0,extraDrops:0,relics:{},totalCollected:0};startFloor()}
function halfWidth(){return 50+Math.min(run.size,3)*12}
function jawPoints(){let w=halfWidth(),closed=1-claw.open;return [-1,1].map(s=>[{x:claw.x+s*10,y:claw.y+6},{x:claw.x+s*w,y:claw.y+35},{x:claw.x+s*w*.82,y:claw.y+64},{x:claw.x+s*(w*.62*(1-closed)+5*closed),y:claw.y+77}])}
function drop(){if(phase!=='aim'||paused||run.drops<1)return;run.drops--;leftHeld=rightHeld=false;aimTarget=null;claw.open=1;const inPath=balls.filter(b=>b.alive&&Math.abs(b.x-claw.x)<halfWidth()*.65);const surface=inPath.length?Math.min(...inPath.map(b=>b.y-b.r)):FLOOR-40;claw.depth=clamp(surface-24,98,FLOOR-82);setPhase('down');message('Claw going down…');}
function collisionPair(a,b){const dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=min*min)return;let d=Math.sqrt(d2)||.001,nx=d2?dx/d:1,ny=d2?dy/d:0;let overlap=(min-d)*.53;a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;let relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){const impulse=-relative*.46;a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse}}
function segmentContact(b,a,z){let dx=z.x-a.x,dy=z.y-a.y,len=dx*dx+dy*dy,t=clamp(((b.x-a.x)*dx+(b.y-a.y)*dy)/len,0,1),x=a.x+t*dx,y=a.y+t*dy,bx=b.x-x,by=b.y-y,d=Math.hypot(bx,by)||.01,over=b.r+3-d;if(over>0){let nx=bx/d,ny=by/d;b.x+=nx*over*.55;b.y+=ny*over*.55;const vel=b.vx*nx+b.vy*ny;if(vel<0){b.vx-=nx*vel*.8;b.vy-=ny*vel*.8}}}
function physics(dt){let active=balls.filter(b=>b.alive&&!b.held);for(const b of active){b.oldX=b.x;b.oldY=b.y;b.vy+=870*dt;b.vx*=Math.pow(.985,dt*60);b.vy*=Math.pow(.998,dt*60);b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.vx*.0005;b.x=clamp(b.x,LEFT+b.r,RIGHT-b.r);if(b.y+b.r>FLOOR){b.y=FLOOR-b.r;b.vy=Math.min(0,-b.vy*.08);b.vx*=.92}}
for(let pass=0;pass<4;pass++){for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++)collisionPair(active[i],active[j]);for(const b of active){b.x=clamp(b.x,LEFT+b.r,RIGHT-b.r);b.y=Math.min(b.y,FLOOR-b.r)}}
if(phase==='down'||phase==='close'){const jaws=jawPoints();for(const b of active)for(const jaw of jaws)for(let i=0;i<jaw.length-1;i++)segmentContact(b,jaw[i],jaw[i+1]);}
// Collected balls keep moving and colliding inside the scoop as it travels.
if(claw.held.length){let dx=claw.x-claw.prevX,dy=claw.y-claw.prevY;for(let b of claw.held){b.x+=dx;b.y+=dy;b.vy+=550*dt;b.vx+=-dx*8*dt;b.vx*=.98;b.x+=b.vx*dt;b.y+=b.vy*dt;}

function help(){if(paused)return;openModal('help','HOW TO PLAY','Grab. Fight. Upgrade.','Move the claw with your finger or the arrow buttons. Press Grab to scoop up to '+run.capacity+' items. Your haul powers your robot; the enemy attacks afterward.',[{mark:'✓',title:'Let’s grab',desc:'Shields carry over between attacks.',action:()=>{closeModal();updateUI()}}],`<div class="legend"><div class="legend-row"><span class="sample" style="background:#ff9b88;color:#743948">⚔</span>Sword · 4 damage per item</div><div class="legend-row"><span class="sample" style="background:#81d7e6;color:#225a73">◇</span>Shield · blocks 4 damage</div><div class="legend-row"><span class="sample" style="background:#f292bb;color:#7f385d">♥</span>Heart · restores 3 health</div><div class="legend-row"><span class="sample" style="background:#b9a0f1;color:#58427c">ϟ</span>Spark · 6 damage</div><div class="legend-row"><span class="sample" style="background:#f3cd76;color:#89613b">●</span>Coins · buy extra drops when you run out</div><div class="legend-row"><span class="sample" style="background:#91acb8;color:#405a70">▪</span>Scrap · 1 damage</div></div>`)}
function pause(){if(paused)return;openModal('pause','TAKE A BREATHER','Machine paused.','Your run is right where you left it.',[{mark:'▶',title:'Keep playing',desc:'Return to the machine.',action:()=>{closeModal();updateUI()}},{mark:'↻',title:'Restart run',desc:'Start again from floor 1.',action:newRun}])}
function hold(button,key){button.addEventListener('pointerdown',e=>{if(paused||phase!=='aim')return;e.preventDefault();button.setPointerCapture(e.pointerId);if(key==='left')leftHeld=true;else rightHeld=true;aimTarget=null});const stop=()=>{if(key==='left')leftHeld=false;else rightHeld=false};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>button.addEventListener(ev,stop))}
hold($('#left'),'left');hold($('#right'),'right');let dragging=false;function aim(e){if(phase!=='aim'||paused)return;const rect=machine.getBoundingClientRect();aimTarget=clamp((e.clientX-rect.left)/rect.width*MW,halfWidth()+13,MW-halfWidth()-13)}machine.addEventListener('pointerdown',e=>{if(phase!=='aim'||paused)return;e.preventDefault();dragging=true;machine.setPointerCapture(e.pointerId);aim(e)});machine.addEventListener('pointermove',e=>{if(dragging)aim(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>machine.addEventListener(ev,()=>dragging=false));$('#drop').onclick=drop;$('#help').onclick=help;$('#pause').onclick=pause;$('#modal').addEventListener('cancel',e=>{e.preventDefault();if(modalMode==='help'||modalMode==='pause'){closeModal();updateUI()}});window.addEventListener('keydown',e=>{if(paused)return;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA'){leftHeld=true;aimTarget=null}if(e.code==='ArrowRight'||e.code==='KeyD'){rightHeld=true;aimTarget=null}if(e.code==='Space'&&!e.repeat)drop();if(e.code==='Escape')pause()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')leftHeld=false;if(e.code==='ArrowRight'||e.code==='KeyD')rightHeld=false});window.addEventListener('blur',()=>{leftHeld=rightHeld=false;dragging=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){leftHeld=rightHeld=false;last=0;accumulator=0}});
newRun();requestAnimationFrame(frame);
})();
</script>
</body></html>
