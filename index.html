<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101f23">
<meta name="description" content="A physical claw-machine roguelike. Scoop your weapons, build your salvager, and conquer the Sunken Vault.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clawbound · The Sunken Vault</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=20260924-2">
</head>
<body>
<main class="app" aria-label="Clawbound game">
<header><div class="brand"><span>⌁</span>CLAW<b>BOUND</b></div><div class="top-actions"><div class="coin-counter" aria-label="Coins"><i class="coin-icon"></i><span id="coins">0</span></div><button class="icon-button" id="sound" aria-label="Mute sound" aria-pressed="true">♪</button><button class="icon-button" id="help" aria-label="How to play">?</button><button class="icon-button" id="pause" aria-label="Pause game">Ⅱ</button></div></header>
<div class="route"><span class="floor" id="floor">FLOOR 01</span><div class="route-line"></div><span id="zone">MOSSY OUTPOST</span><div class="route-dots" id="routeDots" aria-hidden="true"></div></div>
<section class="battle" aria-label="Battle arena"><canvas id="battleCanvas" aria-label="Your robot faces the enemy"></canvas><div class="fighter-labels"><div class="fighter"><div class="name">YOU · SCRAPPER</div><div class="health-line"><div class="bar"><i id="heroBar"></i></div><span class="hp-value" id="heroHp">40/40</span></div></div><div class="fighter enemy"><div class="name" id="enemyName">MOSS MUNCHER</div><div class="health-line"><span class="hp-value" id="enemyHp">24/24</span><div class="bar"><i id="enemyBar"></i></div></div></div></div><div class="battle-tag">VS</div><div class="shield-badge" id="shield">◇ 0 BLOCK</div><div class="intent" id="intent">Next attack · 4</div></section>
<div class="status" id="status" role="status" aria-live="polite">Slide to aim. Scoop a handful.</div>
<section class="machine" aria-label="Claw machine"><div class="machine-top"><div class="machine-title"><i class="led"></i>LOOT CHAMBER</div><div class="machine-stat"><b id="drops">6</b> DROPS LEFT</div></div><div class="glass"><canvas id="machineCanvas" aria-label="Drag to aim the claw, then press Grab"></canvas></div><div class="machine-foot"><span id="clawLabel">STANDARD CLAW</span><div class="capacity" id="capacity" aria-label="Claw capacity: 5"></div><span id="load">0 / 5</span></div></section>
<div class="controls"><button class="move" id="left" aria-label="Move claw left"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg></button><button class="drop" id="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v6m-3 0h6M9 8 5 15l3 5 3-2m4-10 4 7-3 5-3-2"/></svg><span id="dropLabel">GRAB</span></button><button class="move" id="right" aria-label="Move claw right"><svg viewBox="0 0 24 24"><path d="m8 4 10 8-10 8z"/></svg></button></div>
<div class="run-strip"><button id="build" class="text-button">BUILD · 0</button><span>THE SUNKEN VAULT</span><button id="map" class="text-button">EXPEDITION</button></div><div class="inventory" id="inventory"></div><div class="hint">DRAG TO AIM · COLLECT THROUGH THE LEFT CHUTE</div>
</main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modal-eyebrow" id="modalEyebrow"></div><h1 class="modal-title" id="modalTitle"></h1><div class="modal-copy" id="modalCopy"></div><div id="modalExtra"></div><div class="choices" id="choices"></div></dialog>
<script src="physics.js"></script>
<script src="progression.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body></html>
